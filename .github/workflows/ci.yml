name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src tests scripts app.py

      - name: Run tests
        # Prophet's compiled backend may be unavailable on a clean runner; the
        # forecasting layer falls back to Holt-Winters, so the suite is green
        # either way (see src/forecasting.py).
        run: pytest -q
